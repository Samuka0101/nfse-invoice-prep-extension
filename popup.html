<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente NFS-e Portátil</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Assistente NFS-e Portátil</h1>
    <p id="context">Verificando a aba atual…</p>
    <button type="button" id="capture" hidden>Capturar ciclo pendente</button>

    <section id="cycle" hidden aria-label="Ciclo capturado">
      <dl>
        <div><dt>Referência</dt><dd id="reference"></dd></div>
        <div><dt>Mês do serviço</dt><dd id="service-month"></dd></div>
        <div><dt>Valor</dt><dd id="amount"></dd></div>
        <div><dt>Descrição</dt><dd id="description"></dd></div>
      </dl>
      <button type="button" id="copy">Copiar dados</button>
      <button type="button" id="clear" class="secondary">Limpar ciclo</button>
    </section>

    <section id="portal" hidden aria-label="Etapa do Emissor Nacional">
      <div id="service-date-field" hidden>
        <label for="service-date">Data de competência confirmada</label>
        <input id="service-date" type="date">
      </div>
      <button type="button" id="prepare"></button>
      <ul id="checks" hidden></ul>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
